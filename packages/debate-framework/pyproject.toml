[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "debate-framework"
version = "0.1.0"
description = "A multi-agent adversarial debate framework for structured decision-making"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SOREN Team" },
]
keywords = ["ai", "agents", "debate", "multi-agent", "decision-making", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["debate"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/soren/debate-framework"
Documentation = "https://github.com/soren/debate-framework#readme"
Repository = "https://github.com/soren/debate-framework"
